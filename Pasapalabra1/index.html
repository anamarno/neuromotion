<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pasapalabra NeuroUsal — Rosco 1 (Embebido, fix)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --morado:#4A148C; --granate:#AD1457; --granate-hover:#C2185B; --fondo:#F8F5FB;
          --gris:#BDBDBD; --azul-skip:#1976D2; --verde:#2E7D32; --rojo:#C62828; }
  html, body { margin:0; padding:0; background:var(--fondo); font-family:'Inter',system-ui,Arial; color:#222; }
  .container { max-width:1100px; margin:0 auto; padding:24px 16px 48px; }
  h1 { color:var(--morado); text-align:center; font-weight:800; margin:8px 0 8px; font-size:clamp(28px,4vw,40px); }
  .layout { display:grid; grid-template-columns:1fr; gap:18px; }
  @media (min-width: 1000px) { .layout { grid-template-columns:480px 1fr; align-items:center; } }
  .rosco-wrap { display:grid; place-items:center; }
  .rosco { position:relative; width:420px; height:420px; border-radius:50%; background:#fff; box-shadow:0 6px 24px rgba(74,20,140,0.12), 0 2px 6px rgba(0,0,0,0.08); }
  .letter { position:absolute; width:46px; height:46px; border-radius:50%; display:grid; place-items:center; background:#EEE; color:#333; font-weight:700; user-select:none; transition:.2s; box-shadow:0 2px 6px rgba(0,0,0,0.06); }
  .letter.active { transform:scale(1.12); box-shadow:0 6px 18px rgba(173,20,87,0.25); outline:3px solid var(--granate); }
  .letter.neutral { background:#EEE; color:#333; }
  .letter.correct { background:var(--verde); color:#fff; }
  .letter.incorrect { background:#C62828; color:#fff; }
  .letter.skipped { background:#1976D2; color:#fff; }
  .panel { background:#fff; border-radius:16px; padding:16px; box-shadow:0 6px 24px rgba(74,20,140,0.12),0 2px 6px rgba(0,0,0,0.08); }
  .status { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:10px; }
  .status .timer { font-weight:800; color:#AD1457; font-size:20px; }
  .status .score { font-weight:700; color:#4A148C; }
  .instruction { font-weight:700; color:#555; margin:8px 0 4px; }
  .big-letter { text-align:center; font-size:64px; font-weight:800; color:#4A148C; margin:6px 0; }
  .definition { font-size:16px; line-height:1.5; color:#333; margin:6px 0 8px; min-height:48px; }
  .hints { font-size:13px; color:#666; margin-top:2px; display:flex; gap:10px; flex-wrap:wrap; }
  .hint-pill { background:#F1E4F9; color:#4A148C; border-radius:999px; padding:2px 8px; font-weight:600; }
  .input-row { display:flex; gap:10px; align-items:center; }
  .input-row input[type="text"] { flex:1; padding:12px 14px; border-radius:12px; border:2px solid #E0E0E0; font-size:16px; outline:none; transition:border .2s; }
  .input-row input[type="text"]:focus { border-color:#AD1457; }
  .pass-btn { background:#1976D2; color:#fff; }
  .actions button, .pass-btn, #submitBtn { padding:12px 14px; border:none; border-radius:12px; font-weight:700; cursor:pointer; background:#AD1457; color:#fff; }
  .actions button:hover, #submitBtn:hover { background:#C2185B; }
  .endcard { display:none; background:#fff; border-radius:16px; padding:18px; margin-top:12px; border:2px solid #F1E4F9; }
  .endcard.visible { display:block; }
  .end-title { font-weight:800; color:#4A148C; font-size:20px; margin:0 0 6px; }
  .end-score { font-weight:700; color:#AD1457; }
  .review { display:none; margin-top:12px; background:#fff; border-radius:16px; padding:16px; border:2px solid #F1E4F9; }
  .review.visible { display:block; }
  .review-grid { display:grid; grid-template-columns:72px 150px 1fr 1fr; gap:8px; align-items:start; }
  .review-header, .review-item { padding:8px; border-radius:10px; }
  .review-header { font-weight:700; color:#4A148C; background:#F5ECFF; }
  .review-item.correct { background:rgba(46,125,50,0.08); }
  .review-item.incorrect { background:rgba(198,40,40,0.10); }
  .review-item.skipped { background:rgba(25,118,210,0.10); }
  .review-item.neutral { background:rgba(0,0,0,0.05); }
  .legend { display:flex; gap:12px; font-size:13px; color:#555; margin-top:8px; }
  .legend span::before { content:''; display:inline-block; width:12px; height:12px; margin-right:6px; border-radius:3px; vertical-align:-2px; }
  .legend .l-correct::before { background:#2E7D32; }
  .legend .l-incorrect::before { background:#C62828; }
  .legend .l-skipped::before { background:#1976D2; }
  .legend .l-neutral::before { background:#CCC; }
  .letter-img { display:block; margin:10px auto 0; max-width:220px; opacity:.95; border-radius:12px; }
  .toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:6px; }
  .toolbar .group { display:flex; align-items:center; gap:6px; background:#FBF7FF; border:1px solid #E8DBF8; padding:6px 8px; border-radius:10px; }
  .toolbar label { font-size:13px; color:#4A148C; font-weight:700; }
  .toggle { padding:6px 10px; border-radius:10px; border:1px solid #E0E0E0; background:#fff; cursor:pointer; font-weight:700; }
  .toggle[aria-pressed="true"] { background:#4A148C; color:#fff; border-color:#4A148C; }
  select, .time-apply { padding:6px 8px; border-radius:10px; border:1px solid #E0E0E0; background:#fff; }
  .note { font-size:12px; color:#666; }
</style>
</head>
<body>
  <div class="container">
    <h1>Pasapalabra NeuroUsal</h1>
    <div class="layout">
      <div class="rosco-wrap"><div id="rosco" class="rosco" aria-label="Rosco de letras"></div></div>

      <div class="panel">
        <div class="status">
          <div class="timer" id="timer" aria-live="polite">05:00</div>
          <div class="score">Puntuación: <span id="score">0</span></div>
        </div>

        <div class="toolbar">
          <div class="group">
            <label for="difficulty">Dificultad</label>
            <select id="difficulty">
              <option value="normal" selected>Normal</option>
              <option value="facil">Fácil (muestra nº de letras)</option>
            </select>
          </div>
          <div class="group">
            <button id="ttsToggle" class="toggle" aria-pressed="false" title="Activar/Desactivar lectura en voz alta">Voz: OFF</button>
            <button id="sfxToggle" class="toggle" aria-pressed="false" title="Activar/Desactivar sonidos">Sonidos: OFF</button>
          </div>
          <div class="group">
            <label for="timeSelect">Tiempo</label>
            <select id="timeSelect">
              <option value="180">3:00</option>
              <option value="300" selected>5:00</option>
            </select>
            <button id="applyTime" class="time-apply">Aplicar al reiniciar</button>
          </div>
        </div>

        <div class="instruction" id="instruction">Instrucción</div>
        <div class="big-letter" id="bigLetter">A</div>
        <div class="definition" id="definition">Definición</div>
        <div class="hints" id="hints"></div>

        <div class="input-row">
          <input type="text" id="answerInput" placeholder="Escribe tu respuesta y pulsa Enter o Responder" autocomplete="off" />
          <button id="submitBtn" title="Responder">Responder</button>
          <button class="pass-btn" id="passBtn" title="Pasapalabra">Pasapalabra</button>
        </div>
        <div class="note">Enter: con texto ⇒ responde; vacío ⇒ Pasapalabra. El tiempo seleccionado se aplica al reiniciar.</div>

        <img id="letterImg" class="letter-img" src="images/neurona.png" alt="Imagen de la letra activa">

        <div class="endcard" id="endcard" role="status" aria-live="polite">
          <div class="end-title" id="endTitle">¡Juego finalizado!</div>
          <div class="end-score" id="endScore"></div>
          <div class="final-actions">
            <button id="reviewBtn" style="display:none;">Revisar respuestas</button>
            <button id="restartBtn" style="display:none;">Jugar de nuevo</button>
          </div>
        </div>
      </div>
    </div>

    <div class="review" id="review">
      <div class="review-grid" id="reviewGrid">
        <div class="review-header">Letra</div>
        <div class="review-header">Instrucción</div>
        <div class="review-header">Definición</div>
        <div class="review-header">Respuesta dada</div>
      </div>
      <div class="legend">
        <span class="l-correct">Acierto</span>
        <span class="l-incorrect">Error</span>
        <span class="l-skipped">Pasapalabra</span>
        <span class="l-neutral">Sin responder</span>
      </div>
    </div>
  </div>

<script>
// === Datos del rosco (desde CSV, sin K) ===
const QUESTIONS = [{"letra": "A", "instruccion": "EMPIEZA POR", "pregunta": "Parte de una célula nerviosa.", "respuesta": "AXÓN"}, {"letra": "B", "instruccion": "CONTIENE LA", "pregunta": "Órgano que regula todas las funciones corporales.", "respuesta": "CEREBRO"}, {"letra": "C", "instruccion": "EMPIEZA POR", "pregunta": "Estructura ósea que protege la médula espinal.", "respuesta": "COLUMNA VERTEBRAL"}, {"letra": "D", "instruccion": "EMPIEZA POR", "pregunta": "Dificultad para hablar tras un daño cerebral.", "respuesta": "DISARTRIA"}, {"letra": "E", "instruccion": "CONTIENE LA", "pregunta": "Capacidad del cerebro para adaptarse y cambiar.", "respuesta": "NEUROPLASTICIDAD"}, {"letra": "F", "instruccion": "EMPIEZA POR", "pregunta": "Profesión que ayuda a recuperar el movimiento tras una lesión.", "respuesta": "FISIOTERAPIA"}, {"letra": "G", "instruccion": "EMPIEZA POR", "pregunta": "Células del cerebro que dan soporte a las neuronas.", "respuesta": "GLÍA"}, {"letra": "H", "instruccion": "EMPIEZA POR", "pregunta": "Parte del cerebro donde se guarda la memoria.", "respuesta": "HIPOCAMPO"}, {"letra": "I", "instruccion": "EMPIEZA POR", "pregunta": "Actividad para conocer cómo funciona el cerebro.", "respuesta": "INVESTIGACIÓN"}, {"letra": "J", "instruccion": "EMPIEZA POR", "pregunta": "Acción de moverse de forma alegre y divertida, útil en terapia.", "respuesta": "JUGAR"}, {"letra": "L", "instruccion": "EMPIEZA POR", "pregunta": "Parte del cuerpo en la que se localizan los receptores del gusto.", "respuesta": "LENGUA"}, {"letra": "M", "instruccion": "EMPIEZA POR", "pregunta": "Parte invisible de ti que piensa, imagina y siente.", "respuesta": "MENTE"}, {"letra": "N", "instruccion": "EMPIEZA POR", "pregunta": "Ciencia que estudia el cerebro y el sistema nervioso.", "respuesta": "NEUROCIENCIA"}, {"letra": "O", "instruccion": "EMPIEZA POR", "pregunta": "Sentido que nos permite escuchar lo que ocurre a nuestro alrededor.", "respuesta": "OÍDO"}, {"letra": "P", "instruccion": "EMPIEZA POR", "pregunta": "Parte del cerebro que piensa y toma decisiones.", "respuesta": "PREFRONTAL"}, {"letra": "Q", "instruccion": "CONTIENE LA", "pregunta": "Ciencia que estudia los procesos químicos del sistema nervioso.", "respuesta": "NEUROQUÍMICA"}, {"letra": "R", "instruccion": "EMPIEZA POR", "pregunta": "Proceso que ayuda a recuperar habilidades después de una lesión o enfermedad.", "respuesta": "REHABILITACIÓN"}, {"letra": "S", "instruccion": "EMPIEZA POR", "pregunta": "Conjunto de cerebro, médula y nervios.", "respuesta": "SISTEMA NERVIOSO"}, {"letra": "T", "instruccion": "EMPIEZA POR", "pregunta": "Persona que enseña a recuperar la autonomía para vestirse, comer o jugar después de una lesión.", "respuesta": "TERAPEUTA OCUPACIONAL"}, {"letra": "U", "instruccion": "CONTIENE LA", "pregunta": "Célula principal del sistema nervioso.", "respuesta": "NEURONA"}, {"letra": "V", "instruccion": "EMPIEZA POR", "pregunta": "Sentido que usamos para descubrir colores, formas y luces.", "respuesta": "VISTA"}, {"letra": "W", "instruccion": "EMPIEZA POR", "pregunta": "Consola de videojuegos con la que ayudar a mejorar el movimiento.", "respuesta": "WII"}, {"letra": "X", "instruccion": "CONTIENE LA", "pregunta": "Gas que necesita el cerebro para funcionar bien.", "respuesta": "OXÍGENO"}, {"letra": "Y", "instruccion": "CONTIENE LA", "pregunta": "Imagen que se toma para ver los huesos dentro del cuerpo.", "respuesta": "RAYOS X"}, {"letra": "Z", "instruccion": "EMPIEZA POR", "pregunta": "Ruido suave y constante qu a veces oímos en los oídos.", "respuesta": "ZUMBIDO"}];

const IMAGE_BASE = 'images/'; const IMAGE_EXTS = ['.png','.jpg','.jpeg','.webp']; const FALLBACK_IMG = 'images/neurona.png';

let letters = [];
let state = QUESTIONS.map(q => ({ status:'neutral', userAnswer:'', ...q }));
let activeIndex = 0, score = 0, totalAnswered = 0;
let timerId = null, totalTime = 5*60, remaining = totalTime, finished = false;

let ttsEnabled = false, sfxEnabled = false, difficulty = 'normal';

const roscoEl = document.getElementById('rosco'), bigLetterEl = document.getElementById('bigLetter');
const instructionEl = document.getElementById('instruction'), definitionEl = document.getElementById('definition');
const hintsEl = document.getElementById('hints');
const inputEl = document.getElementById('answerInput'), submitBtn = document.getElementById('submitBtn'), passBtn = document.getElementById('passBtn');
const scoreEl = document.getElementById('score'), timerEl = document.getElementById('timer');
const endcardEl = document.getElementById('endcard'), endTitleEl = document.getElementById('endTitle'), endScoreEl = document.getElementById('endScore');
const reviewBtn = document.getElementById('reviewBtn'), restartBtn = document.getElementById('restartBtn');
const reviewEl = document.getElementById('review'), reviewGridEl = document.getElementById('reviewGrid'), letterImgEl = document.getElementById('letterImg');

const ttsToggle = document.getElementById('ttsToggle'), sfxToggle = document.getElementById('sfxToggle');
const difficultySel = document.getElementById('difficulty'), timeSelect = document.getElementById('timeSelect'), applyTimeBtn = document.getElementById('applyTime');

function normalizeStr(s){
  if(!s) return '';
  return s.toString()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'')
    .replace(/[¡!¿?.,;:()\[\]{}"'-]/g,'')
    .replace(/\s+/g,' ')
    .trim()
    .toLowerCase();
}

function lettersCount(s){
  if(!s) return 0;
  s = s.toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  try { return (s.match(/[\p{L}\d]/gu) || []).length; } catch(e) {
    return (s.replace(/[^a-zA-Z0-9ñÑ]/g,'').match(/./g) || []).length;
  }
}
function wordCount(s){ if(!s) return 0; return s.toString().trim().replace(/\s+/g,' ').split(' ').filter(Boolean).length; }

function buildRosco(){ const N=state.length, r=190, cx=210, cy=210; letters=[]; roscoEl.innerHTML='';
  for(let i=0;i<N;i++){ const ang=(i/N)*2*Math.PI-Math.PI/2, x=cx+r*Math.cos(ang), y=cy+r*Math.sin(ang);
    const d=document.createElement('div'); d.className='letter neutral'; d.textContent=state[i].letra; d.style.left=(x-23)+'px'; d.style.top=(y-23)+'px'; roscoEl.appendChild(d); letters.push(d);}}
function buildImageCandidates(letter){ const l=letter.toLowerCase(); const variants=[l]; if(l==='ñ') variants.push('n'); const list=[]; for(const v of variants) for(const e of IMAGE_EXTS) list.push(IMAGE_BASE+v+e); return list; }
function setLetterImage(letter){ const c=buildImageCandidates(letter); let i=0; function next(){ if(i>=c.length){ letterImgEl.src=FALLBACK_IMG; letterImgEl.onerror=null; return; } letterImgEl.onerror=()=>{i++; next();}; letterImgEl.src=c[i]; } next(); }

function showHintsFor(q){
  hintsEl.innerHTML='';
  if (wordCount(q.respuesta) >= 2) { const s=document.createElement('span'); s.className='hint-pill'; s.textContent='(dos palabras)'; hintsEl.appendChild(s); }
  if (difficulty === 'facil') { const n=lettersCount(q.respuesta); const s=document.createElement('span'); s.className='hint-pill'; s.textContent='(' + n + ' letras)'; hintsEl.appendChild(s); }
}

function speak(text){ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang='es-ES'; speechSynthesis.speak(u);}catch(e){} }
function sayLetter(l){ const L=(l||'').toUpperCase(); const map={ 'Ñ':'eñe' }; return map[L] || L; }
function buildSpokenPrompt(q){
  const inst = normalizeStr(q.instruccion || '');
  let prefix = '';
  if (inst.includes('empieza'))       prefix = 'Empieza por ' + sayLetter(q.letra) + '.';
  else if (inst.includes('contiene')) prefix = 'Contiene la letra ' + sayLetter(q.letra) + '.';
  else                                prefix = q.instruccion + ' ' + sayLetter(q.letra) + '.';
  let spoken = q.pregunta || '';
  if (wordCount(q.respuesta) >= 2) spoken += ' (dos palabras)';
  return prefix + ' ' + spoken;
}

function showActive(index){ activeIndex=index; state.forEach((s,i)=>letters[i].classList.toggle('active', i===activeIndex)); const q=state[activeIndex];
  bigLetterEl.textContent=q.letra; instructionEl.textContent=q.instruccion.toUpperCase(); definitionEl.textContent=q.pregunta; inputEl.value=''; inputEl.focus(); setLetterImage(q.letra); showHintsFor(q); if(ttsEnabled) speak(buildSpokenPrompt(q)); }
function nextUnresolved(from){ const N=state.length; for(let st=1; st<=N; st++){ const i=(from+st)%N; if(state[i].status==='neutral'||state[i].status==='skipped') return i;} return -1; }
function setStatus(i, status){ state[i].status=status; letters[i].classList.remove('neutral','correct','incorrect','skipped'); letters[i].classList.add(status); }

let audioCtx=null; function ensureAudioCtx(){ if(!audioCtx){ const AC=window.AudioContext||window.webkitAudioContext; if(AC) audioCtx=new AC(); } }
function playBeep(freq=880,dur=0.12){ ensureAudioCtx(); if(!audioCtx) return; const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.type='sine'; o.frequency.value=freq;
  g.gain.setValueAtTime(0.001,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.2,audioCtx.currentTime+0.01); g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
  o.connect(g).connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+dur); }
function playBuzz(){ ensureAudioCtx(); if(!audioCtx) return; const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.type='square'; o.frequency.value=220;
  g.gain.setValueAtTime(0.15,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.18); o.connect(g).connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+0.2); }

function submitAnswer(){ if(finished) return; const q=state[activeIndex]; const user=inputEl.value.trim(); q.userAnswer=user; const ok=normalizeStr(user)===normalizeStr(q.respuesta);
  if(ok){ setStatus(activeIndex,'correct'); score+=10; if(sfxEnabled) playBeep(); } else { setStatus(activeIndex,'incorrect'); score-=5; if(sfxEnabled) playBuzz(); } scoreEl.textContent=score; totalAnswered+=1; advance(); }
function skipCurrent(){ if(finished) return; const q=state[activeIndex]; if(q.status!=='skipped') setStatus(activeIndex,'skipped'); advance(); }
function advance(){ const next=nextUnresolved(activeIndex); if(next===-1){ finishGame('¡Rosco completado!'); } else { showActive(next); } }

function startTimer(){ timerEl.textContent=fmt(remaining); clearInterval(timerId); timerId=setInterval(()=>{ remaining-=1; if(remaining<=0){ remaining=0; timerEl.textContent=fmt(remaining); clearInterval(timerId); finishGame('Tiempo agotado'); } else { timerEl.textContent=fmt(remaining);} },1000); }
function fmt(s){ const m=Math.floor(s/60).toString().padStart(2,'0'); const ss=(s%60).toString().padStart(2,'0'); return m+':'+ss; }

function finishGame(title){ finished=true; clearInterval(timerId); endTitleEl.textContent=title; const bonus=Math.floor(remaining/15); const total=score+bonus;
  endScoreEl.textContent='Puntuación final: '+total+' (incluye bonus por tiempo: +'+bonus+')'; endcardEl.classList.add('visible'); reviewBtn.style.display='inline-block'; restartBtn.style.display='inline-block'; buildReview(); }
function buildReview(){ const nodes=Array.from(reviewGridEl.querySelectorAll('.review-item')); nodes.forEach(n=>n.remove());
  state.forEach(q=>{ ['letra','instruccion','pregunta','userAnswer'].forEach((k,idx)=>{ const d=document.createElement('div'); d.className='review-item '+q.status;
    d.textContent= idx===0? q.letra : idx===1? q.instruccion.toUpperCase() : idx===2? q.pregunta : (q.userAnswer||'—'); reviewGridEl.appendChild(d); }); }); }

submitBtn.addEventListener('click', submitAnswer);
passBtn.addEventListener('click', skipCurrent);
inputEl.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); if(inputEl.value.trim()==='') skipCurrent(); else submitAnswer(); }});
reviewBtn.addEventListener('click', ()=>{ reviewEl.classList.toggle('visible'); reviewBtn.textContent = reviewEl.classList.contains('visible') ? 'Ocultar revisión' : 'Revisar respuestas'; });
restartBtn.addEventListener('click', ()=>{ window.location.reload(); });

ttsToggle.addEventListener('click', ()=>{ ttsEnabled=!ttsEnabled; ttsToggle.setAttribute('aria-pressed', ttsEnabled?'true':'false'); ttsToggle.textContent = ttsEnabled?'Voz: ON':'Voz: OFF'; if(ttsEnabled){ const q=state[activeIndex]; speak(buildSpokenPrompt(q)); } });
sfxToggle.addEventListener('click', ()=>{ sfxEnabled=!sfxEnabled; sfxToggle.setAttribute('aria-pressed', sfxEnabled?'true':'false'); sfxToggle.textContent = sfxEnabled?'Sonidos: ON':'Sonidos: OFF'; if(sfxEnabled) ensureAudioCtx(); });
difficultySel.addEventListener('change', ()=>{ difficulty=difficultySel.value; showHintsFor(state[activeIndex]); });
applyTimeBtn.addEventListener('click', ()=>{ const sel=parseInt(timeSelect.value,10); totalTime=sel; alert('Tiempo ajustado a '+fmt(totalTime)+'. Se aplica al reiniciar.'); });

function init(){ buildRosco(); showActive(0); totalTime=parseInt(timeSelect.value,10); remaining=totalTime; startTimer(); }
init();
</script>
</body>
</html>
